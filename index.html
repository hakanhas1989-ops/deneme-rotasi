// ---- PDF'i 100'er sayfalık parçalara bölüp base64'e çevirir ----
async function pdfiParcalaBase64(arrayBuffer, sayfaBasi = 100) {
  const { PDFDocument } = PDFLib;
  const kaynak = await PDFDocument.load(arrayBuffer);
  const toplamSayfa = kaynak.getPageCount();
  const parcalar = [];
  for (let start = 0; start < toplamSayfa; start += sayfaBasi) {
    const yeni = await PDFDocument.create();
    const end = Math.min(start + sayfaBasi, toplamSayfa);
    const indeksler = [];
    for (let i = start; i < end; i++) indeksler.push(i);
    const kopyalar = await yeni.copyPages(kaynak, indeksler);
    kopyalar.forEach((p) => yeni.addPage(p));
    const bytes = await yeni.save();
    let binary = "";
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    parcalar.push(btoa(binary));
  }
  return { parcalar, toplamSayfa };
}

// ---- Bir PDF parçasını AI'ya gönderip öğrenciyi arar ----
async function parcadaOgrenciAra(base64Pdf, ad, no) {
  const promptText =
    `Bu bir deneme sınavı sonuç belgesidir (farklı yayınevlerinden gelebilir, format değişebilir). ` +
    `İçinde "${ad}"${no ? ` (öğrenci no: ${no})` : ""} adlı öğrenciyi ara. ` +
    `Bulursan ders bazında doğru, yanlış, boş sayılarını ve o dersin netini, ayrıca öğrencinin toplam netini JSON olarak ver. ` +
    `SADECE şu formatta JSON döndür, başka hiçbir açıklama, markdown işareti veya metin ekleme:\n` +
    `{"bulundu": true, "toplamNet": 85.5, "dersler": [{"ders": "Türkçe", "dogru": 18, "yanlis": 2, "bos": 0, "net": 17.33}]}\n` +
    `Öğrenciyi bu belgede bulamazsan sadece {"bulundu": false} döndür.`;

  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 1500,
      messages: [
        {
          role: "user",
          content: [
            { type: "document", source: { type: "base64", media_type: "application/pdf", data: base64Pdf } },
            { type: "text", text: promptText },
          ],
        },
      ],
    }),
  });
  const data = await res.json();
  const metin = (data && data.content && data.content.find((c) => c.type === "text") || {}).text || "";
  try {
    const temiz = metin.replace(/```json|```/g, "").trim();
    return JSON.parse(temiz);
  } catch (e) {
    return { bulundu: false };
  }
}

// ---- Deneyimli danışman/koç kimliğiyle AI değerlendirmesi üretir ----
async function aiDegerlendirmesiUret(ogrenci, kutuphaneMetinleri) {
  const denemeler = [...(ogrenci.denemeler || [])].sort((a, b) => (a.tarih || "").localeCompare(b.tarih || ""));
  const denemeOzeti = denemeler
    .map((d) => `${d.tarih || ""} — ${d.denemeAdi}: toplam net ${d.toplamNet}` +
      (d.dersler ? ", " + d.dersler.map((x) => `${x.ders}: ${x.net} net`).join(", ") : ""))
    .join("\n");
  const kaynakMetni = (kutuphaneMetinleri || []).map((k) => `[${k.baslik}]\n${k.icerik}`).join("\n\n").slice(0, 6000);

  const promptText =
    `Sen yıllarca LGS ve YKS sürecinde çalışmış, deneyimli bir psikolojik danışman/rehber öğretmen ve sınav koçusun. ` +
    `Aşağıda bir öğrencinin deneme sınavı geçmişi var. Bunu, aşağıdaki referans kaynakları da dikkate alarak bütün bir süreç olarak değerlendir. ` +
    `Güçlü olduğu dersleri, gelişim göstermesi gereken alanları ve motive edici somut bir öneriyi, sıcak ama gerçekçi bir dille anlat. ` +
    `150-200 kelimeyi geçme. Sadece düz metin döndür, markdown veya başlık kullanma.\n\n` +
    `ÖĞRENCİ DENEME GEÇMİŞİ:\n${denemeOzeti || "Henüz deneme kaydı yok."}\n\n` +
    (kaynakMetni ? `REFERANS KAYNAKLAR:\n${kaynakMetni}\n\n` : "") +
    `Değerlendirmeni yaz:`;

  const res = await fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-5",
      max_tokens: 600,
      messages: [{ role: "user", content: promptText }],
    }),
  });
  const data = await res.json();
  const metin = (data && data.content && data.content.find((c) => c.type === "text") || {}).text || "";
  return metin.trim();
}

// ---- Bir sınıftaki öğrencilerin denemelerini deneme adına göre gruplayıp ortalama hesaplar ----
function sinifDenemeleriHesapla(ogrenciler) {
  const map = {};
  ogrenciler.forEach((o) => {
    (o.denemeler || []).forEach((d) => {
      if (!map[d.denemeAdi]) map[d.denemeAdi] = { toplam: 0, sayi: 0, tarih: d.tarih || "" };
      map[d.denemeAdi].toplam += Number(d.toplamNet) || 0;
      map[d.denemeAdi].sayi += 1;
      if (d.tarih && (!map[d.denemeAdi].tarih || d.tarih < map[d.denemeAdi].tarih)) {
        map[d.denemeAdi].tarih = d.tarih;
      }
    });
  });
  return Object.entries(map)
    .map(([denemeAdi, v]) => ({ denemeAdi, ortalama: v.sayi ? v.toplam / v.sayi : 0, katilimci: v.sayi, tarih: v.tarih }))
    .sort((a, b) => (a.tarih || "").localeCompare(b.tarih || ""));
}

// ---- Büyük, eksen etiketli, güncel değer balonlu trend grafiği (öğrenci/sınıf detayı için) ----
function TrendGrafikBuyuk({ values, etiketler, width = 320, height = 160 }) {
  if (!values || values.length < 2) return <span className="text-xs" style={{ color: "#9B96AE" }}>trend için en az 2 deneme gerekli</span>;
  const min = 0;
  const max = Math.ceil(Math.max(...values) / 10) * 10 || 10;
  const range = max - min || 1;
  const padL = 34, padR = 14, padT = 24, padB = 20;
  const innerW = width - padL - padR;
  const innerH = height - padT - padB;
  const step = innerW / (values.length - 1);
  const noktalar = values.map((v, i) => ({
    x: padL + i * step,
    y: padT + innerH - ((v - min) / range) * innerH,
    v,
  }));
  const yol = noktalar.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const up = values[values.length - 1] >= values[0];
  const cizgiRenk = up ? "#4B3FA8" : "#B3455C";
  const izgaraSatiri = 4;
  const sonNokta = noktalar[noktalar.length - 1];

  return (
    <svg width={width} height={height}>
      {[...Array(izgaraSatiri + 1)].map((_, i) => {
        const y = padT + (innerH / izgaraSatiri) * i;
        const deger = Math.round(max - (max / izgaraSatiri) * i);
        return (
          <g key={"h" + i}>
            <line x1={padL} y1={y} x2={width - padR} y2={y} stroke="#EDEBF5" strokeWidth="1" strokeDasharray="1.5 3" />
            <text x={padL - 8} y={y + 3} fontSize="9" textAnchor="end" fill="#B7B2C9">{deger}</text>
          </g>
        );
      })}
      {noktalar.map((p, i) => (
        <line key={"v" + i} x1={p.x} y1={padT} x2={p.x} y2={height - padB} stroke="#F3F1F9" strokeWidth="1" strokeDasharray="1.5 3" />
      ))}
      <path d={yol} fill="none" stroke={cizgiRenk} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      {noktalar.map((p, i) => (
        <circle key={"p" + i} cx={p.x} cy={p.y} r="3" fill="#FFFFFF" stroke={cizgiRenk} strokeWidth="2" />
      ))}
      <rect x={sonNokta.x - 16} y={sonNokta.y - 22} width="32" height="16" rx="8" fill={cizgiRenk} />
      <text x={sonNokta.x} y={sonNokta.y - 11} fontSize="9" fontWeight="bold" textAnchor="middle" fill="#FFFFFF">{sonNokta.v.toFixed(1)}</text>
      {etiketler && noktalar.map((p, i) => (
        <text key={"e" + i} x={p.x} y={height - 6} fontSize="8" textAnchor="middle" fill="#B7B2C9">{etiketler[i]}</text>
      ))}
    </svg>
  );
}

function Sparkline({ values, width = 150, height = 60 }) {
  if (!values || values.length < 2) return <span className="text-xs" style={{ color: "#9B96AE" }}>henüz deneme yok</span>;
  const min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
  const pad = 6;
  const innerW = width - pad * 2;
  const innerH = height - pad * 2;
  const step = values.length > 1 ? innerW / (values.length - 1) : 0;
  const noktalar = values.map((v, i) => ({
    x: pad + i * step,
    y: pad + innerH - ((v - min) / range) * innerH,
    v,
  }));
  const yol = noktalar.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const up = values[values.length - 1] >= values[0];
  const cizgiRenk = up ? "#6D5FCC" : "#B3455C";
  const izgaraSatiri = 3;
  return (
    <svg width={width} height={height}>
      {[...Array(izgaraSatiri + 1)].map((_, i) => {
        const y = pad + (innerH / izgaraSatiri) * i;
        return <line key={"h" + i} x1={pad} y1={y} x2={width - pad} y2={y} stroke="#EDEBF5" strokeWidth="1" strokeDasharray="1.5 3" />;
      })}
      {noktalar.map((p, i) => (
        <line key={"v" + i} x1={p.x} y1={pad} x2={p.x} y2={height - pad} stroke="#F3F1F9" strokeWidth="1" strokeDasharray="1.5 3" />
      ))}
      <path d={yol} fill="none" stroke={cizgiRenk} strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round" />
      {noktalar.map((p, i) => (
        <circle key={"p" + i} cx={p.x} cy={p.y} r="2.5" fill="#FFFFFF" stroke={cizgiRenk} strokeWidth="1.75" />
      ))}
    </svg>
  );
}

// ---------------- GİRİŞ EKRANI ----------------
function GirisEkrani() {
  const [mod, setMod] = useState("giris"); // giris | kayit
  const [eposta, setEposta] = useState("");
  const [sifre, setSifre] = useState("");
  const [hata, setHata] = useState("");
  const [yukleniyor, setYukleniyor] = useState(false);

  const gonder = async (e) => {
    e.preventDefault();
    setHata("");
    setYukleniyor(true);
    try {
      if (mod === "giris") {
        await auth.signInWithEmailAndPassword(eposta, sifre);
      } else {
        await auth.createUserWithEmailAndPassword(eposta, sifre);
      }
    } catch (err) {
      setHata(hataMetni(err.code));
    }
    setYukleniyor(false);
  };

  const hataMetni = (code) => {
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "E-posta veya şifre hatalı.";
    if (code === "auth/user-not-found") return "Bu e-posta ile kayıtlı kullanıcı yok.";
    if (code === "auth/email-already-in-use") return "Bu e-posta zaten kayıtlı.";
    if (code === "auth/weak-password") return "Şifre en az 6 karakter olmalı.";
    return "Bir hata oluştu, tekrar deneyin.";
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4" style={{ background: MARKA.bg }}>
      <div className="w-full max-w-sm bg-white rounded-3xl overflow-hidden" style={{ border: `1px solid ${MARKA.kartSinir}`, boxShadow: "0 10px 40px rgba(55,48,163,0.12)" }}>
        <div className="px-6 pt-8 pb-6 flex flex-col items-center" style={{ background: MARKA.gradient }}>
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-3" style={{ background: "rgba(255,255,255,0.15)" }}>
            <RouteMark size={32} />
          </div>
          <div className="font-baslik font-extrabold text-lg text-white">Deneme Rotası</div>
          <div className="text-xs text-white mt-0.5" style={{ opacity: 0.85 }}>başarıya giden yolu izle</div>
        </div>
        <form onSubmit={gonder} className="flex flex-col gap-3 p-6">
          <input type="email" required placeholder="E-posta" value={eposta}
            onChange={(e) => setEposta(e.target.value)}
            className="px-3.5 py-2.5 rounded-xl text-sm" style={{ border: `1px solid ${MARKA.kartSinir}` }} />
          <input type="password" required placeholder="Şifre" value={sifre}
            onChange={(e) => setSifre(e.target.value)}
            className="px-3.5 py-2.5 rounded-xl text-sm" style={{ border: `1px solid ${MARKA.kartSinir}` }} />
          {hata && <div className="text-xs" style={{ color: "#B3455C" }}>{hata}</div>}
          <button type="submit" disabled={yukleniyor}
            className="py-2.5 rounded-xl text-sm font-bold text-white"
            style={{ background: MARKA.gradient }}>
            {yukleniyor ? "..." : mod === "giris" ? "Giriş Yap" : "Kayıt Ol"}
          </button>
        </form>
        <button onClick={() => setMod(mod === "giris" ? "kayit" : "giris")}
          className="text-xs mb-6 w-full text-center" style={{ color: MARKA.metinAcik }}>
          {mod === "giris" ? "Hesabın yok mu? Kayıt ol" : "Zaten hesabın var mı? Giriş yap"}
        </button>
      </div>
    </div>
  );
}

// ---------------- DENEME YÜKLE FORMU ----------------
function DenemeYukleForm({ ogrenciler, onKaydet }) {
  const [seciliId, setSeciliId] = useState("");
  const [denemeAdi, setDenemeAdi] = useState("");
  const [dosya, setDosya] = useState(null);
  const [durum, setDurum] = useState("bos"); // bos | okunuyor | bulundu | bulunamadi | hata
  const [sonuc, setSonuc] = useState(null);
  const [ilerleme, setIlerleme] = useState("");

  const seciliOgrenci = ogrenciler.find((o) => o.id === seciliId);

  const oku = async () => {
    if (!seciliOgrenci || !dosya) return;
    setDurum("okunuyor");
    setSonuc(null);
    try {
      const arrayBuffer = await dosya.arrayBuffer();
      const { parcalar, toplamSayfa } = await pdfiParcalaBase64(arrayBuffer, 100);
      let bulunanSonuc = null;
      for (let i = 0; i < parcalar.length; i++) {
        setIlerleme(`${toplamSayfa} sayfanın ${i + 1}. parçası (${parcalar.length} parça) okunuyor...`);
        const r = await parcadaOgrenciAra(parcalar[i], seciliOgrenci.ad, seciliOgrenci.no);
        if (r && r.bulundu) { bulunanSonuc = r; break; }
      }
      setIlerleme("");
      setSonuc(bulunanSonuc);
      setDurum(bulunanSonuc ? "bulundu" : "bulunamadi");
    } catch (e) {
      setIlerleme("");
      setDurum("hata");
    }
  };

  const onayla = () => {
    onKaydet(seciliOgrenci.id, { denemeAdi: denemeAdi || "Deneme", tarih: new Date().toISOString().slice(0, 10), ...sonuc });
    setDosya(null); setSonuc(null); setDurum("bos"); setDenemeAdi("");
  };

  return (
    <div className="bg-white rounded-2xl p-4 max-w-xl mx-auto" style={{ border: "1px solid #E7E4F3" }}>
      <div className="text-sm font-semibold mb-3" style={{ color: "#6B6478" }}>Deneme Sonucu Yükle</div>
      <div className="flex flex-col gap-2 mb-3">
        <select value={seciliId} onChange={(e) => setSeciliId(e.target.value)}
          className="px-3 py-2 rounded-lg text-sm" style={{ border: "1px solid #E7E4F3" }}>
          <option value="">Öğrenci seç...</option>
          {ogrenciler.map((o) => (
            <option key={o.id} value={o.id}>{o.ad} — {o.sinif}</option>
          ))}
        </select>
        <input placeholder="Deneme adı (örn. 3. Deneme)" value={denemeAdi} onChange={(e) => setDenemeAdi(e.target.value)}
          className="px-3 py-2 rounded-lg text-sm" style={{ border: "1px solid #E7E4F3" }} />
        <input type="file" accept="application/pdf" onChange={(e) => setDosya(e.target.files[0])}
          className="text-sm" />
      </div>

      <button onClick={oku} disabled={!seciliOgrenci || !dosya || durum === "okunuyor"}
        className="px-3 py-2 rounded-lg text-sm font-medium text-white w-full"
        style={{ background: "#6D5FCC", opacity: (!seciliOgrenci || !dosya || durum === "okunuyor") ? 0.5 : 1 }}>
        {durum === "okunuyor" ? "Okunuyor..." : "AI ile Oku"}
      </button>

      {ilerleme && <div className="text-xs mt-2" style={{ color: "#6B6478" }}>{ilerleme}</div>}

      {durum === "bulunamadi" && (
        <div className="text-xs mt-3" style={{ color: "#B3455C" }}>
          Öğrenci bu belgede bulunamadı. Ad/soyad belgedekiyle birebir uyuşuyor mu kontrol et.
        </div>
      )}
      {durum === "hata" && (
        <div className="text-xs mt-3" style={{ color: "#B3455C" }}>
          Bir hata oluştu, tekrar dener misin?
        </div>
      )}

      {durum === "bulundu" && sonuc && (
        <div className="mt-4 pt-4" style={{ borderTop: "1px solid #E7E4F3" }}>
          <div className="text-sm font-semibold mb-2">Bulunan sonuç — onayla</div>
          <div className="text-lg font-bold mb-2" style={{ color: "#6D5FCC" }}>Toplam net: {sonuc.toplamNet}</div>
          <div className="flex flex-col gap-1 mb-3">
            {(sonuc.dersler || []).map((d, i) => (
              <div key={i} className="flex justify-between text-xs" style={{ color: "#6B6478" }}>
                <span>{d.ders}</span>
                <span>D:{d.dogru} Y:{d.yanlis} B:{d.bos} — Net:{d.net}</span>
              </div>
            ))}
          </div>
          <button onClick={onayla} className="px-3 py-2 rounded-lg text-sm font-medium text-white w-full" style={{ background: "#6D5FCC" }}>
            Onayla ve Kaydet
          </button>
        </div>
      )}
    </div>
  );
}

// ---- Öğrencinin denemelerini ders bazında grupla (her ders için kronolojik net listesi) ----
function dersleriGrupla(denemeler) {
  const map = {};
  (denemeler || []).forEach((d) => {
    (d.dersler || []).forEach((ders) => {
      if (!map[ders.ders]) map[ders.ders] = [];
      map[ders.ders].push({ denemeAdi: d.denemeAdi, tarih: d.tarih, net: Number(ders.net) || 0 });
    });
  });
  return map;
}

  const dersGruplari = dersleriGrupla(denemeler);
  const toplamNetler = denemeler.map((d) => d.toplamNet);

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto" style={{ background: "rgba(42,30,18,0.4)" }}>
      <div className="max-w-2xl mx-auto my-6 bg-white rounded-2xl p-6" id="rapor-alani">
        <div className="flex justify-between items-start mb-4 yazdirma-gizli">
          <div className="text-sm font-semibold" style={{ color: "#6B6478" }}>Rapor Önizleme</div>
          <div className="flex gap-2">
            <button onClick={() => window.print()} className="px-3 py-1.5 rounded-lg text-xs font-medium text-white" style={{ background: "#6D5FCC" }}>
              Yazdır / PDF Kaydet
            </button>
            <button onClick={onKapat} className="px-3 py-1.5 rounded-lg text-xs" style={{ color: "#6B6478" }}>Kapat</button>
          </div>
        </div>

        <div className="mb-4">
          <div className="text-xl font-bold" style={{ color: "#1F1B2E" }}>{ogrenci.ad}</div>
          <div className="text-sm" style={{ color: "#6B6478" }}>Sınıf: {ogrenci.sinif} — No: {ogrenci.no}</div>
        </div>

        <div className="mb-5">
          <div className="text-sm font-semibold mb-2" style={{ color: "#6B6478" }}>Toplam Net Gelişimi</div>
          {toplamNetler.length >= 2 ? (
            <Sparkline values={toplamNetler} width={300} height={60} />
          ) : (
            <div className="text-xs" style={{ color: "#9B96AE" }}>Trend için en az 2 deneme gerekli.</div>
          )}
          <table className="w-full text-xs mt-3" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr style={{ color: "#6B6478", borderBottom: "1px solid #E7E4F3" }}>
                <th className="text-left py-1">Deneme</th>
                <th className="text-left py-1">Tarih</th>
                <th className="text-right py-1">Toplam Net</th>
              </tr>
            </thead>
            <tbody>
              {denemeler.map((d, i) => (
                <tr key={i} style={{ borderBottom: "1px solid #F1EFF9" }}>
                  <td className="py-1">{d.denemeAdi}</td>
                  <td className="py-1">{d.tarih}</td>
                  <td className="py-1 text-right font-semibold">{d.toplamNet}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="mb-5">
          <div className="text-sm font-semibold mb-2" style={{ color: "#6B6478" }}>Ders Bazında Net Gelişimi</div>
          {Object.keys(dersGruplari).length === 0 && (
            <div className="text-xs" style={{ color: "#9B96AE" }}>Ders bazında veri yok.</div>
          )}
          {Object.entries(dersGruplari).map(([ders, kayitlar]) => (
            <div key={ders} className="mb-3">
              <div className="text-xs font-semibold mb-1">{ders}</div>
              <table className="w-full text-xs" style={{ borderCollapse: "collapse" }}>
                <tbody>
                  {kayitlar.map((k, i) => (
                    <tr key={i} style={{ borderBottom: "1px solid #F1EFF9" }}>
                      <td className="py-0.5" style={{ color: "#6B6478" }}>{k.denemeAdi}</td>
                      <td className="py-0.5 text-right">{k.net}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          ))}
        </div>

        <div className="text-xs pt-3" style={{ color: "#9B96AE", borderTop: "1px solid #E7E4F3" }}>
          {aiDegerlendirme ? (
            <div>
              <div className="text-sm font-semibold mb-2" style={{ color: "#6B6478" }}>Danışman Değerlendirmesi</div>
              <div style={{ color: "#1F1B2E" }}>{aiDegerlendirme}</div>
            </div>
          ) : (
            "AI danışman değerlendirmesi henüz oluşturulmadı. Konu bazlı eksik analizi, konu dağılımı verisi eklendikten sonra ayrıca gelecek."
          )}
        </div>
      </div>
    </div>
  );
}

// ---------------- KÜTÜPHANE FORMU ----------------
function KutuphaneForm({ kademe, kaynaklar, onEkle, onSil }) {
  const [baslik, setBaslik] = useState("");
  const [icerik, setIcerik] = useState("");
  const [formAcik, setFormAcik] = useState(false);

  const kademeKaynaklari = kaynaklar.filter((k) => k.kademe === kademe);

  const kaydet = () => {
    if (!baslik.trim() || !icerik.trim()) return;
    onEkle({ baslik: baslik.trim(), icerik: icerik.trim(), kademe });
    setBaslik(""); setIcerik(""); setFormAcik(false);
  };

  return (
    <div className="max-w-2xl mx-auto">
      {formAcik ? (
        <div className="bg-white rounded-2xl p-4 mb-4" style={{ border: "1px solid #E7E4F3" }}>
          <div className="text-sm font-semibold mb-3" style={{ color: "#6B6478" }}>
            Yeni Kaynak Ekle — {kademe === KADEME.ORTAOKUL ? "Ortaokul" : "Lise"}
          </div>
          <input placeholder="Başlık (örn. LGS Sınav Kaygısı ile Başa Çıkma)" value={baslik} onChange={(e) => setBaslik(e.target.value)}
            className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ border: "1px solid #E7E4F3" }} />
          <textarea placeholder="Makale/belge metnini buraya yapıştır..." value={icerik} onChange={(e) => setIcerik(e.target.value)}
            rows={6} className="w-full px-3 py-2 rounded-lg text-sm mb-2" style={{ border: "1px solid #E7E4F3" }} />
          <div className="flex gap-2">
            <button onClick={kaydet} className="px-3 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "#6D5FCC" }}>Kaydet</button>
            <button onClick={() => setFormAcik(false)} className="px-3 py-2 rounded-lg text-sm" style={{ color: "#6B6478" }}>Vazgeç</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setFormAcik(true)}
          className="mb-4 px-3 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "#6D5FCC" }}>
          + Kaynak Ekle
        </button>
      )}

      {kademeKaynaklari.length === 0 ? (
        <div className="bg-white rounded-2xl p-6 text-center text-sm" style={{ border: "1px solid #E7E4F3", color: "#9B96AE" }}>
          Bu kademe için henüz kaynak eklenmedi. Makale/belge metnini kopyalayıp yapıştırarak ekleyebilirsin.
        </div>
      ) : (
        <div className="flex flex-col gap-2">
          {kademeKaynaklari.map((k, i) => {
            const renk = kartRengi(i);
            return (
              <div key={k.id} className="bg-white rounded-2xl p-4" style={{ border: `1px solid ${renk}55`, boxShadow: "0 1px 3px rgba(42,30,18,0.06)" }}>
                <div className="flex justify-between items-start mb-1 gap-2">
                  <div className="flex items-center gap-2">
                    <OkIkonu renk={renk} size={18} />
                    <div className="text-sm font-bold">{k.baslik}</div>
                  </div>
                  <button onClick={() => onSil(k.id)} className="text-xs shrink-0" style={{ color: "#B3455C" }}>Sil</button>
                </div>
                <div className="text-xs mb-2" style={{ color: "#6B6478" }}>{k.icerik.slice(0, 140)}{k.icerik.length > 140 ? "..." : ""}</div>
                <span className="inline-block px-2.5 py-1 rounded-full text-xs font-bold uppercase tracking-wide" style={{ background: renk + "22", color: renk }}>
                  Kaynak
                </span>
              </div>
            );
          })}

      )}
    </div>
  );
}

// ---------------- HIZLI DENEME GİRİŞİ (PDF'siz manuel) ----------------
function HizliDenemeForm({ slot, kademe, mevcut, onKaydet, onIptal }) {
  const dersListesi = kademe === KADEME.ORTAOKUL ? ORTAOKUL_DERSLER : LISE_DERSLER;
  const [denemeAdi, setDenemeAdi] = useState(mevcut?.denemeAdi || `Deneme ${slot}`);
  const [tarih, setTarih] = useState(mevcut?.tarih || new Date().toISOString().slice(0, 10));
  const [netler, setNetler] = useState(() => {
    const baslangic = {};
    dersListesi.forEach((d) => {
      const bulunan = (mevcut?.dersler || []).find((x) => x.ders === d);
      baslangic[d] = bulunan ? String(bulunan.net) : "";
    });
    return baslangic;
  });

  const toplamNet = dersListesi.reduce((acc, d) => acc + (parseFloat(netler[d]) || 0), 0);

  const kaydet = () => {
    const dersler = dersListesi
      .filter((d) => netler[d] !== "")
      .map((d) => ({ ders: d, net: Math.round((parseFloat(netler[d]) || 0) * 100) / 100 }));
    onKaydet({ slot, denemeAdi, tarih, toplamNet: Math.round(toplamNet * 100) / 100, dersler, bulundu: true });
  };

  return (
    <div className="bg-white rounded-2xl p-4" style={{ border: "1.5px solid #6D5FCC" }}>
      <div className="flex justify-between items-center gap-2 mb-3">
        <input value={denemeAdi} onChange={(e) => setDenemeAdi(e.target.value)}
          className="font-baslik font-bold text-sm px-2 py-1.5 rounded-lg flex-1 min-w-0" style={{ border: "1px solid #E7E4F3" }} />
        <input type="date" value={tarih} onChange={(e) => setTarih(e.target.value)}
          className="text-xs px-2 py-1.5 rounded-lg" style={{ border: "1px solid #E7E4F3" }} />
      </div>
      <div className="grid grid-cols-2 gap-2 mb-3">
        {dersListesi.map((d) => (
          <div key={d}>
            <div className="text-[11px] font-medium mb-0.5" style={{ color: dersRengi(d) }}>{d}</div>
            <input type="number" step="0.01" placeholder="net" value={netler[d]}
              onChange={(e) => setNetler({ ...netler, [d]: e.target.value })}
              className="w-full px-2 py-1.5 rounded-lg text-sm" style={{ border: "1px solid #E7E4F3" }} />
          </div>
        ))}
      </div>
      <div className="text-sm font-baslik font-bold mb-3" style={{ color: "#4B3FA8" }}>Toplam Net: {toplamNet.toFixed(2)}</div>
      <div className="flex gap-2">
        <button onClick={kaydet} className="px-3 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "#6D5FCC" }}>Kaydet</button>
        <button onClick={onIptal} className="px-3 py-2 rounded-lg text-sm" style={{ color: "#6B6478" }}>Vazgeç</button>
      </div>
    </div>
  );
}

// ---- Sabit 10 slotluk deneme grid'i: doldurulmuş kart veya "+ Net Gir" ----
function DenemeGridi({ ogrenci, kademe, onKaydet, onSil }) {
  const [acikSlot, setAcikSlot] = useState(null);
  const denemeler = ogrenci.denemeler || [];

  const slotlar = Array(10).fill(null);
  denemeler.forEach((d) => {
    if (d.slot && d.slot >= 1 && d.slot <= 10 && !slotlar[d.slot - 1]) slotlar[d.slot - 1] = d;
  });
  denemeler.forEach((d) => {
    if (!d.slot || slotlar[d.slot - 1] !== d) {
      const bosIndex = slotlar.findIndex((s) => s === null);
      if (bosIndex !== -1) slotlar[bosIndex] = d;
    }
  });

  return (
    <div>
      <div className="text-xs font-semibold mb-2" style={{ color: "#6B6478" }}>Hızlı Deneme Girişi (10 slot)</div>
      <div className="grid grid-cols-2 gap-2">
        {slotlar.map((d, i) => {
          const slotNo = i + 1;
          if (acikSlot === slotNo) {
            return (
              <div key={slotNo} className="col-span-2">
                <HizliDenemeForm slot={slotNo} kademe={kademe} mevcut={d}
                  onKaydet={(veri) => { onKaydet(veri); setAcikSlot(null); }}
                  onIptal={() => setAcikSlot(null)} />
              </div>
            );
          }
          if (d) {
            return (
              <div key={slotNo} className="bg-white rounded-xl p-3" style={{ border: "1px solid #EDEBF5" }}>
                <div className="flex justify-between items-start mb-1.5">
                  <div className="font-baslik font-semibold text-[13px]">{d.denemeAdi}</div>
                  <div className="text-base font-baslik font-bold" style={{ color: "#4B3FA8" }}>{d.toplamNet}</div>
                </div>
                <div className="flex flex-wrap gap-1 mb-2">
                  {(d.dersler || []).map((ds, j) => (
                    <Rozet key={j} renk={dersRengi(ds.ders)}>{ds.ders.slice(0, 1)}:{ds.net}</Rozet>
                  ))}
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setAcikSlot(slotNo)} className="text-[11px] font-semibold" style={{ color: "#6D5FCC" }}>Düzenle</button>
                  <button onClick={() => onSil(slotNo)} className="text-[11px] font-semibold" style={{ color: "#B3455C" }}>Sil</button>
                </div>
              </div>
            );
          }
          return (
            <button key={slotNo} onClick={() => setAcikSlot(slotNo)}
              className="rounded-xl py-3 text-center transition-colors"
              style={{ border: "1.5px dashed #D8D4EC", color: "#9B96AE" }}>
              <div className="text-[11px] font-semibold mb-0.5">Deneme {slotNo}</div>
              <div className="text-xs font-medium" style={{ color: "#6D5FCC" }}>+ Net Gir</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ---------------- ANA UYGULAMA ----------------
function AnaUygulama({ user }) {
  const [kademe, setKademe] = useState(KADEME.ORTAOKUL);
  const [aktifTab, setAktifTab] = useState("ogrenciler");
  const [ogrenciler, setOgrenciler] = useState([]);
  const [yuklendi, setYuklendi] = useState(false);
  const [seciliSinif, setSeciliSinif] = useState(null);
  const [seciliOgrenci, setSeciliOgrenci] = useState(null);
  const [formAcik, setFormAcik] = useState(false);
  const [raporOgrenciId, setRaporOgrenciId] = useState(null);
  const [kutuphane, setKutuphane] = useState([]);
  const [aiDegerlendirme, setAiDegerlendirme] = useState("");
  const [aiYukleniyor, setAiYukleniyor] = useState(false);

  const docRef = db.collection("users").doc(user.uid).collection("data").doc("state");

  useEffect(() => {
    docRef.get().then((snap) => {
      if (snap.exists) {
        const veri = snap.data();
        setOgrenciler(veri.ogrenciler || []);
        setKutuphane(veri.kutuphane || []);
      }
      setYuklendi(true);
    });
  }, []);

  useEffect(() => {
    if (!yuklendi) return;
    docRef.set({ ogrenciler, kutuphane }, { merge: true });
  }, [ogrenciler, kutuphane]);

  const kademeOgrencileri = ogrenciler.filter((o) => o.kademe === kademe);
  const siniflar = [...new Set(kademeOgrencileri.map((o) => o.sinif))].sort();
  const siniftakiOgrenciler = seciliSinif ? kademeOgrencileri.filter((o) => o.sinif === seciliSinif) : [];

  const ogrenciEkle = (yeniOgrenci) => {
    setOgrenciler([...ogrenciler, { ...yeniOgrenci, id: Date.now().toString(), denemeler: [] }]);
    setFormAcik(false);
  };

  const denemeKaydet = (ogrenciId, denemeSonucu) => {
    setOgrenciler(ogrenciler.map((o) => {
      if (o.id !== ogrenciId) return o;
      const yeniDenemeler = [...(o.denemeler || []), denemeSonucu];
      const yeniNetler = [...(o.netler || []), denemeSonucu.toplamNet];
      return { ...o, denemeler: yeniDenemeler, netler: yeniNetler };
    }));
    if (seciliOgrenci?.id === ogrenciId) {
      setSeciliOgrenci((prev) => prev ? { ...prev, netler: [...(prev.netler || []), denemeSonucu.toplamNet] } : prev);
    }
  };

  const kutuphaneyeEkle = (yeniKaynak) => {
    setKutuphane([...kutuphane, { ...yeniKaynak, id: Date.now().toString() }]);
  };

  const kutuphanedenSil = (id) => {
    setKutuphane(kutuphane.filter((k) => k.id !== id));
  };

  const denemeKaydetSlot = (ogrenciId, veri) => {
    const hesapla = (denemelerListesi) => {
      const digerleri = denemelerListesi.filter((d) => d.slot !== veri.slot);
      const yeniler = [...digerleri, veri].sort((a, b) => (a.slot || 99) - (b.slot || 99));
      return { denemeler: yeniler, netler: yeniler.map((d) => d.toplamNet) };
    };
    setOgrenciler(ogrenciler.map((o) => (o.id !== ogrenciId ? o : { ...o, ...hesapla(o.denemeler || []) })));
    setSeciliOgrenci((prev) => (!prev || prev.id !== ogrenciId ? prev : { ...prev, ...hesapla(prev.denemeler || []) }));
  };

  const denemeSilSlot = (ogrenciId, slotNo) => {
    const hesapla = (denemelerListesi) => {
      const yeniler = denemelerListesi.filter((d) => d.slot !== slotNo);
      return { denemeler: yeniler, netler: yeniler.map((d) => d.toplamNet) };
    };
    setOgrenciler(ogrenciler.map((o) => (o.id !== ogrenciId ? o : { ...o, ...hesapla(o.denemeler || []) })));
    setSeciliOgrenci((prev) => (!prev || prev.id !== ogrenciId ? prev : { ...prev, ...hesapla(prev.denemeler || []) }));
  };

  const aiDegerlendirmesiOlustur = async () => {
    if (!seciliOgrenci) return;
    setAiYukleniyor(true);
    setAiDegerlendirme("");
    try {
      const kademeKaynaklari = kutuphane.filter((k) => k.kademe === kademe);
      const metin = await aiDegerlendirmesiUret(seciliOgrenci, kademeKaynaklari);
      setAiDegerlendirme(metin || "Değerlendirme oluşturulamadı, tekrar dener misin?");
    } catch (e) {
      setAiDegerlendirme("Bir hata oluştu, tekrar dener misin?");
    }
    setAiYukleniyor(false);
  };

  const handleKademeDegistir = (k) => {
    setKademe(k);
    setSeciliSinif(null);
    setSeciliOgrenci(null);
  };

  const TABS = [
    { key: "ogrenciler", label: "Öğrenciler", ikon: "👥" },
    { key: "siniflar", label: "Sınıflar", ikon: "🏫" },
    { key: "yukle", label: "Deneme Yükle", ikon: "📄" },
    { key: "kutuphane", label: "Kütüphane", ikon: "📚" },
    { key: "aikoc", label: "AI Koç", ikon: "🧭" },
    { key: "ayarlar", label: "Ayarlar", ikon: "⚙️" },
  ];

  const toplamDenemeSayisi = kademeOgrencileri.reduce((acc, o) => acc + (o.denemeler || []).length, 0);

  return (
    <div className="min-h-screen" style={{ background: "#FAFAFC", color: "#1F1B2E" }}>
      <header className="sticky top-0 z-10" style={{ background: "linear-gradient(135deg, #4B3FA8, #6D5FCC)" }}>
        <div className="max-w-5xl mx-auto px-4 pt-4 pb-3">
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2">
              <RouteMark light />
              <div>
                <div className="font-baslik font-bold leading-tight text-white">Deneme Rotası</div>
                <div className="text-xs leading-tight" style={{ color: "rgba(255,255,255,0.7)" }}>başarıya giden yolu izle</div>
              </div>
            </div>
            <button onClick={() => auth.signOut()} className="text-xs px-2.5 py-1 rounded-full" style={{ color: "#fff", background: "rgba(255,255,255,0.15)" }}>Çıkış</button>
          </div>
          <div className="flex items-center justify-between">
            <div className="flex rounded-full p-0.5 text-sm" style={{ background: "rgba(255,255,255,0.15)" }}>
              {Object.values(KADEME).map((k) => (
                <button key={k} onClick={() => handleKademeDegistir(k)}
                  className="px-3 py-1 rounded-full font-medium transition-colors"
                  style={{ background: kademe === k ? "#fff" : "transparent", color: kademe === k ? "#4B3FA8" : "rgba(255,255,255,0.85)" }}>
                  {k === KADEME.ORTAOKUL ? "Ortaokul" : "Lise"}
                </button>
              ))}
            </div>
            <div className="text-xs" style={{ color: "rgba(255,255,255,0.75)" }}>
              {kademeOgrencileri.length} öğrenci · {siniflar.length} sınıf · {toplamDenemeSayisi} deneme
            </div>
          </div>
        </div>
        <nav className="max-w-5xl mx-auto px-4 flex gap-1 overflow-x-auto pb-0" style={{ background: "#FAFAFC", borderTopLeftRadius: 20, borderTopRightRadius: 20 }}>
          {TABS.map((t) => (
            <button key={t.key} onClick={() => setAktifTab(t.key)}
              className="whitespace-nowrap px-3 py-3 text-[13px] font-medium transition-colors flex items-center gap-1.5"
              style={{
                color: aktifTab === t.key ? "#4B3FA8" : "#9B96AE",
                borderBottom: aktifTab === t.key ? "2.5px solid #6D5FCC" : "2.5px solid transparent",
              }}>
              <span>{t.ikon}</span>
              <span>{t.label}</span>
            </button>
          ))}
        </nav>
      </header>

      <main className="max-w-5xl mx-auto px-4 py-5">
        {aktifTab === "ogrenciler" && (
          <div>
            <div className="grid grid-cols-3 gap-2 mb-4">
              <div className="rounded-xl px-3 py-3 text-center" style={{ background: "#F1EFFC" }}>
                <div className="text-xl font-baslik font-bold" style={{ color: "#4B3FA8" }}>{kademeOgrencileri.length}</div>
                <div className="text-[11px]" style={{ color: "#6B6478" }}>Öğrenci</div>
              </div>
              <div className="rounded-xl px-3 py-3 text-center" style={{ background: "#F1EFFC" }}>
                <div className="text-xl font-baslik font-bold" style={{ color: "#4B3FA8" }}>{siniflar.length}</div>
                <div className="text-[11px]" style={{ color: "#6B6478" }}>Sınıf</div>
              </div>
              <div className="rounded-xl px-3 py-3 text-center" style={{ background: "#F1EFFC" }}>
                <div className="text-xl font-baslik font-bold" style={{ color: "#4B3FA8" }}>{toplamDenemeSayisi}</div>
                <div className="text-[11px]" style={{ color: "#6B6478" }}>Deneme Kaydı</div>
              </div>
            </div>

            {formAcik ? (
              <OgrenciEkleForm kademe={kademe} onEkle={ogrenciEkle} onIptal={() => setFormAcik(false)} />
            ) : (
              <button onClick={() => setFormAcik(true)}
                className="mb-4 px-3 py-2 rounded-lg text-sm font-medium text-white" style={{ background: "#6D5FCC" }}>
                + Öğrenci Ekle
              </button>
            )}
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7E4F3" }}>
                <div className="text-sm font-semibold mb-3" style={{ color: "#6B6478" }}>Sınıflar</div>
                {siniflar.length === 0 && <div className="text-sm" style={{ color: "#9B96AE" }}>Henüz öğrenci eklenmedi.</div>}
                {siniflar.map((s, i) => (
                  <KartOge
                    key={s}
                    baslik={s}
                    aciklama={`${kademeOgrencileri.filter((o) => o.sinif === s).length} öğrenci`}
                    etiket={seciliSinif === s ? "SEÇİLİ" : "SINIF"}
                    renk={kartRengi(i)}
                    vurgulu={seciliSinif === s}
                    onClick={() => { setSeciliSinif(s); setSeciliOgrenci(null); }}
                  />
                ))}
              </div>
              <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7E4F3" }}>
                <div className="text-sm font-semibold mb-3" style={{ color: "#6B6478" }}>
                  Öğrenciler {seciliSinif ? `— ${seciliSinif}` : ""}
                </div>
                {!seciliSinif && <div className="text-sm" style={{ color: "#9B96AE" }}>Önce bir sınıf seç.</div>}
                {siniftakiOgrenciler.map((o, i) => (
                  <KartOge
                    key={o.id}
                    baslik={o.ad}
                    aciklama={`No: ${o.no || "—"}`}
                    etiket={o.denemeler && o.denemeler.length ? `${o.denemeler.length} DENEME` : "DENEME YOK"}
                    renk={kartRengi(i)}
                    vurgulu={seciliOgrenci?.id === o.id}
                    onClick={() => { setSeciliOgrenci(o); setAiDegerlendirme(""); }}
                  />
                ))}
              </div>
              <div className="bg-white rounded-2xl p-4" style={{ border: "1px solid #E7E4F3" }}>
                <div className="text-sm font-semibold mb-3" style={{ color: "#6B6478" }}>Gelişim</div>
                {!seciliOgrenci && <div className="text-sm" style={{ color: "#9B96AE" }}>Bir öğrenci seç.</div>}
                {seciliOgrenci && (
                  <div className="flex flex-col gap-4">
                    <div>
                      <div className="font-baslik font-semibold">{seciliOgrenci.ad}</div>
                      <div className="text-xs" style={{ color: "#9B96AE" }}>No: {seciliOgrenci.no}</div>
                    </div>
                    <div>
                      <div className="text-xs mb-1" style={{ color: "#6B6478" }}>Toplam net trendi</div>
                      <TrendGrafikBuyuk
                        values={seciliOgrenci.netler}
                        etiketler={(seciliOgrenci.denemeler || []).map((d) => d.denemeAdi)}
                      />
                    </div>

                    <DenemeGridi
                      ogrenci={seciliOgrenci}
                      kademe={kademe}
                      onKaydet={(veri) => denemeKaydetSlot(seciliOgrenci.id, veri)}
                      onSil={(slotNo) => denemeSilSlot(seciliOgrenci.id, slotNo)}
                    />

                    <button onClick={aiDegerlendirmesiOlustur} disabled={aiYukleniyor}
                      className="text-sm font-medium rounded-lg px-3 py-2 text-white"
                      style={{ background: "#6D5FCC", opacity: aiYukleniyor ? 0.6 : 1 }}>
                      {aiYukleniyor ? "Değerlendiriliyor..." : "AI Danışman Değerlendirmesi Oluştur"}
                    </button>
                    {aiDegerlendirme && (
                      <div className="text-sm p-3 rounded-lg" style={{ background: "#FAFAFC", color: "#1F1B2E", border: "1px solid #E7E4F3" }}>
                        {aiDegerlendirme}
                      </div>
                    )}

                    <button onClick={() => setRaporOgrenciId(seciliOgrenci.id)}
                      className="text-sm font-medium rounded-lg px-3 py-2 text-white"
                      style={{ background: "#6D5FCC" }}>
                      PDF Rapor Oluştur
                    </button>
                    <div className="text-xs pt-2" style={{ color: "#9B96AE", borderTop: "1px solid #E7E4F3" }}>
                      Konu bazlı eksik analizi, konu dağılımı verisi eklendikten sonra ayrıca gelecek.
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        )}

        {aktifTab === "siniflar" && (
          <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            {siniflar.length === 0 && <div className="text-sm" style={{ color: "#9B96AE" }}>Henüz öğrenci eklenmedi.</div>}
            {siniflar.map((s, i) => {
              const list = kademeOgrencileri.filter((o) => o.sinif === s);
              const denemeler = sinifDenemeleriHesapla(list);
              const ortalamaDizisi = denemeler.map((d) => d.ortalama);
              const sonOrtalama = ortalamaDizisi.length ? ortalamaDizisi[ortalamaDizisi.length - 1] : null;
              const renk = kartRengi(i);
              return (
                <div key={s} className="bg-white rounded-2xl p-4" style={{ border: `1px solid ${renk}55`, boxShadow: "0 1px 3px rgba(42,30,18,0.06)" }}>
                  <div className="flex justify-between items-start mb-2">
                    <div className="flex items-center gap-2">
                      <OkIkonu renk={renk} />
                      <div>
                        <div className="font-baslik font-bold">{s}</div>
                        <div className="text-xs" style={{ color: "#9B96AE" }}>{list.length} öğrenci</div>
                      </div>
                    </div>
                    {sonOrtalama !== null && (
                      <div className="text-right">
                        <div className="text-lg font-bold" style={{ color: renk }}>{sonOrtalama.toFixed(1)}</div>
                        <div className="text-xs" style={{ color: "#9B96AE" }}>son ortalama</div>
                      </div>
                    )}
                  </div>

                  {ortalamaDizisi.length >= 2 && (
                    <div className="mb-3">
                      <Sparkline values={ortalamaDizisi} width={200} height={40} />
                    </div>
                  )}

                  {denemeler.length === 0 ? (
                    <div className="text-xs" style={{ color: "#9B96AE" }}>Henüz deneme sonucu yok.</div>
                  ) : (
                    <div className="flex flex-col gap-1 pt-2 mb-2" style={{ borderTop: "1px solid #E7E4F3" }}>
                      {denemeler.map((d, j) => (
                        <div key={j} className="flex justify-between text-xs" style={{ color: "#6B6478" }}>
                          <span>{d.denemeAdi}</span>
                          <span>{d.ortalama.toFixed(1)} net ({d.katilimci} öğrenci)</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {aktifTab === "yukle" && (
          <DenemeYukleForm ogrenciler={kademeOgrencileri} onKaydet={denemeKaydet} />
        )}

        {aktifTab === "kutuphane" && (
          <KutuphaneForm kademe={kademe} kaynaklar={kutuphane} onEkle={kutuphaneyeEkle} onSil={kutuphanedenSil} />
        )}

        {aktifTab === "aikoc" && (
          <div className="max-w-2xl mx-auto">
            <div className="rounded-2xl p-5 mb-4 text-white" style={{ background: "linear-gradient(135deg, #4B3FA8, #6D5FCC)" }}>
              <div className="text-xs font-semibold uppercase tracking-wider mb-1" style={{ color: "rgba(255,255,255,0.75)" }}>AI LGS/YKS Danışmanı</div>
              <div className="font-baslik font-bold text-lg mb-1">Yıllarca bu süreçte çalışmış bir koç gibi düşün</div>
              <div className="text-sm" style={{ color: "rgba(255,255,255,0.85)" }}>
                Öğrencinin deneme geçmişini ve kütüphanedeki kaynakları birlikte değerlendirip
                güçlü yönlerini, gelişim alanlarını ve somut bir öneriyi yazılı olarak sunar.
              </div>
            </div>

            <div className="bg-white rounded-xl p-4 mb-4" style={{ border: "1px solid #EDEBF5" }}>
              <div className="text-xs font-semibold mb-2" style={{ color: "#6B6478" }}>Öğrenci Seç</div>
              <select value={seciliOgrenci?.id || ""} onChange={(e) => {
                const o = kademeOgrencileri.find((x) => x.id === e.target.value);
                setSeciliOgrenci(o || null);
                setAiDegerlendirme("");
              }} className="w-full px-3 py-2 rounded-lg text-sm" style={{ border: "1px solid #E7E4F3" }}>
                <option value="">Öğrenci seç...</option>
                {kademeOgrencileri.map((o) => (
                  <option key={o.id} value={o.id}>{o.ad} — {o.sinif}</option>
                ))}
              </select>
            </div>

            {seciliOgrenci && (
              <>
                <button onClick={aiDegerlendirmesiOlustur} disabled={aiYukleniyor}
                  className="w-full py-3 rounded-xl text-sm font-semibold text-white mb-4"
                  style={{ background: "#4B3FA8", opacity: aiYukleniyor ? 0.6 : 1 }}>
                  {aiYukleniyor ? "Değerlendiriliyor..." : `${seciliOgrenci.ad} için Değerlendirme Oluştur`}
                </button>
                {aiDegerlendirme && (
                  <div className="bg-white rounded-xl p-4" style={{ border: "1px solid #EDEBF5" }}>
                    <div className="text-xs font-semibold mb-2" style={{ color: "#4B3FA8" }}>Danışman Değerlendirmesi — {seciliOgrenci.ad}</div>
                    <div className="text-sm leading-relaxed" style={{ color: "#1F1B2E" }}>{aiDegerlendirme}</div>
                  </div>
                )}
              </>
            )}
            {!seciliOgrenci && (
              <div className="text-center text-sm py-6" style={{ color: "#9B96AE" }}>
                Değerlendirme oluşturmak için önce bir öğrenci seç.
              </div>
            )}
          </div>
        )}

        {aktifTab === "ayarlar" && (
          <div className="bg-white rounded-2xl p-6 max-w-xl mx-auto text-sm" style={{ border: "1px solid #E7E4F3", color: "#6B6478" }}>
            Giriş yapan hesap: {user.email}
          </div>
        )}
      </main>

      {raporOgrenciId && (
        <RaporGorunumu
          ogrenci={ogrenciler.find((o) => o.id === raporOgrenciId)}
          aiDegerlendirme={aiDegerlendirme}
          onKapat={() => setRaporOgrenciId(null)}
        />
      )}
    </div>
  );
}

// ---------------- KÖK BİLEŞEN ----------------
function App() {
  const [user, setUser] = useState(undefined); // undefined: yükleniyor, null: giriş yok

  useEffect(() => {
    const kaldir = auth.onAuthStateChanged((u) => setUser(u));
    return kaldir;
  }, []);

  if (user === undefined) {
    return <div className="min-h-screen flex items-center justify-center text-sm" style={{ color: "#6B6478" }}>Yükleniyor...</div>;
  }
  if (!user) return <GirisEkrani />;
  return <AnaUygulama user={user} />;
}

const kok = ReactDOM.createRoot(document.getElementById("root"));
kok.render(<App />);

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
</script>
</body>
</html>
